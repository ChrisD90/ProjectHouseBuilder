name: Windows Desktop Testbuild
on:
  workflow_dispatch:
  push:
    branches: [feature/windows-desktop]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PHB_OCR_ENV: ${{ github.workspace }}\desktop\generated\ocr-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/requirements.txt
          npm --prefix frontend ci --no-audit --no-fund
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Native Windows runtime and access tests
        run: python -m unittest tests.test_desktop -v
      - name: Prepare bundled OCR
        shell: pwsh
        run: |
          & "$env:CONDA\Scripts\conda.exe" create --yes --prefix "$env:PHB_OCR_ENV" --override-channels -c conda-forge tesseract poppler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable and installer
        run: python desktop/build_windows.py
      - name: Verify the packaged executable without Python on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $report = "$env:RUNNER_TEMP\desktop-smoke.json"
          $process = Start-Process -FilePath '.\dist\ProjectHouseBuilder\ProjectHouseBuilder.exe' -ArgumentList @('--smoke-test','--smoke-output',"`"$report`"") -PassThru -Wait
          if ($process.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report }; throw 'Packaged application failed.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.ocr.ready) { throw 'Packaged OCR/runtime is incomplete.' }
          Copy-Item $report dist\desktop-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectHouseBuilder-Windows-x64-Testbuild
          path: |
            dist/installer/*Setup.exe
            dist/desktop-smoke.json
            desktop/INSTALLATION.txt
          if-no-files-found: error
          retention-days: 14
