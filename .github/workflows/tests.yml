name: Tests
on:
  push:
    branches: [main, feature/synology-nas, dev/local-testing]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/costs.js
          node --check static/offers.js
          node --check static/receipts.js
          node --check static/ui.js
          node --check static/stammdaten.js
          node --check static/schedule_chat.js
          node --check static/import_jobs.js
          node --check static/finanzierung.js
          node --check static/shell.js
          node --check static/daten.js
          node --check static/sw.js
  local-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated local Compose setup
        run: docker compose --env-file .env.dev.example -f compose.dev.yaml config --quiet
