name: Tests
on:
  push:
    branches: [main, feature/synology-nas, dev/local-testing]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check static/phb-workflow.js
          node --test tests/workflow_runtime.test.cjs
          node --check static/app.js
          node --check static/gantt_drag.js
          node --check static/task_completion.js
          node --check static/receipt_cancellations.js
          node --check static/costs.js
          node --check static/cost_plan_imports.js
          node --check static/energieplanung.js
          node --check static/dokumente.js
          node --check static/offers.js
          node --check static/receipts.js
          node --check static/ui.js
          node --check static/stammdaten.js
          node --check static/schedule_chat.js
          node --check static/import_jobs.js
          node --check static/finanzierung.js
          node --check static/shell.js
          node --check static/daten.js
          node --check static/chatgpt.js
          node --check static/sw.js
  ocr:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision project-local OCR on Intel macOS
        if: matrix.os == 'macos-15-intel'
        run: python scripts/setup_intel_ocr.py
      - name: Set up native OCR (same bootstrap as app start)
        run: sh scripts/ensure_ocr.sh
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Real photo and scanned PDF recognition
        run: python dev/ocr_smoke.py
  local-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated local Compose setup
        run: docker compose --env-file .env.dev.example -f compose.dev.yaml config --quiet
      - name: Build OCR image and recognize scans as container user
        run: |
          docker build --tag phb-ocr-ci .
          docker run --rm --network none --entrypoint python phb-ocr-ci dev/ocr_smoke.py
